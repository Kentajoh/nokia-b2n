name: Device archive

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl flex git \
            libssl-dev python-is-python3 python3 rsync wget xz-utils zip

      - name: Build the kernel, boot image, and device archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"
          ./build.sh 2>&1 | tee build.log
          mkdir -p out
          cp workdir/tmp/partitions/boot.img out/boot.img
          python3 - <<'PY'
          import pathlib, struct, tarfile
          data = bytearray(pathlib.Path("out/boot.img").read_bytes())
          if data[:8] != b"ANDROID!":
              raise SystemExit("boot.img is missing the Android boot magic")
          kernel_size, kernel_addr, ramdisk_size, ramdisk_addr, second_size, second_addr, tags_addr, page_size, header_version = struct.unpack_from("<9I", data, 8)
          print(f"kernel_size={kernel_size:#x} kernel_addr={kernel_addr:#x}")
          print(f"ramdisk_size={ramdisk_size:#x} ramdisk_addr={ramdisk_addr:#x}")
          print(f"second_size={second_size:#x} second_addr={second_addr:#x}")
          print(f"tags_addr={tags_addr:#x} page_size={page_size} header_version={header_version}")
          if header_version != 0 or page_size != 4096:
              raise SystemExit("unexpected boot header")
          if kernel_size == 0 or ramdisk_size == 0:
              raise SystemExit("boot image is missing the kernel or ramdisk")
          # Stock boot_a uses second_addr 0xf00000 with no second image.
          # The image is padded to the partition and an AVB footer is appended
          # even when append_vbmeta is false. This device's vbmeta slots are
          # empty and stock boot has no footer, so drop it before publishing.
          if second_size == 0 and second_addr != 0x00F00000:
              struct.pack_into("<I", data, 28, 0x00F00000)
              print("set second_addr to 0xf00000")
          if data[-64:-60] == b"AVBf":
              original, vbmeta_off, vbmeta_size = struct.unpack_from(">QQQ", data[-64:], 12)
              if data[vbmeta_off:vbmeta_off + 4] != b"AVB0":
                  raise SystemExit(f"AVB footer does not point at AVB0 ({vbmeta_off})")
              data[vbmeta_off:] = b"\x00" * (len(data) - vbmeta_off)
              print(f"removed AVB footer, original image {original} bytes, vbmeta {vbmeta_size} bytes")
          cmdline = bytes(data[64:64 + 512]).split(b"\x00", 1)[0]
          print(f"cmdline {len(cmdline)} bytes: {cmdline.decode()}")
          if b"ramoops.console_size=0x40000" not in cmdline:
              raise SystemExit("boot command line is missing the recovery ramoops layout")
          pathlib.Path("out/boot.img").write_bytes(data)
          archive = pathlib.Path("out/device_B2N.tar.xz")
          if not archive.is_file():
              raise SystemExit("device_B2N.tar.xz was not produced")
          names = tarfile.open(archive, "r:xz").getnames()
          required = [
              "partitions/boot.img",
              "system/opt/halium-overlay/etc/ofono/binder.d/qti.conf",
              "system/opt/halium-overlay/etc/deviceinfo/devices/halium.yaml",
          ]
          missing = [name for name in required if name not in names]
          if missing:
              overlay = [name for name in names if "halium-overlay" in name]
              raise SystemExit(
                  "device archive is missing: " + ", ".join(missing)
                  + "\narchive overlay entries:\n" + "\n".join(overlay)
              )
          print(f"device archive {archive.stat().st_size} bytes, {len(names)} members")
          PY

      - name: Publish the boot image
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/boot-stage
          cp build.log /tmp/boot-stage/build.log 2>/dev/null || true
          cp out/boot.img /tmp/boot-stage/boot.img 2>/dev/null || true
          cp out/device_B2N.tar.xz /tmp/boot-stage/device_B2N.tar.xz 2>/dev/null || true
          cp out/device_B2N.tar.build /tmp/boot-stage/device_B2N.tar.build 2>/dev/null || true
          if [ -f /tmp/boot-stage/device_B2N.tar.xz ]; then
            bytes=$(wc -c < /tmp/boot-stage/device_B2N.tar.xz)
            if [ "$bytes" -gt 90000000 ]; then
              echo "device_B2N.tar.xz is ${bytes} bytes and is too large to store in git"
              rm /tmp/boot-stage/device_B2N.tar.xz
            fi
          fi
          if [ ! -f /tmp/boot-stage/build.log ] && [ ! -f /tmp/boot-stage/boot.img ]; then
            echo "Nothing to publish"
            exit 0
          fi
          mkdir -p /tmp/boot-publish
          cd /tmp/boot-publish
          git init -b ci/boot-img
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/Kentajoh/nokia-b2n.git"
          if git fetch --depth 1 origin ci/boot-img; then
            git checkout -B ci/boot-img FETCH_HEAD
          fi
          cp /tmp/boot-stage/* .
          git add -A
          git -c user.name="Kent Johansen" -c user.email="kent.a.johansen@gmail.com" \
            commit -m "Publish the B2N device archive from ${GITHUB_SHA}" || exit 0
          git push origin HEAD:ci/boot-img

      - uses: actions/upload-artifact@v4
        with:
          name: device-archive
          path: |
            out/boot.img
            out/device_B2N.tar.xz
            out/device_B2N.tar.build
          if-no-files-found: error
