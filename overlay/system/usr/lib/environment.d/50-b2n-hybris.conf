# Vendor GLES for every user service (apps do not inherit lsc-wrapper).
HYBRIS_LD_LIBRARY_PATH=/vendor/lib64/egl:/vendor/lib64:/system/lib64
ANDROID_ROOT=/system
ANDROID_DATA=/data
QT_QPA_PLATFORM=ubuntumirclient
# ual copies this into app units; keep it pointing at nested Lomiri.
# %t is not expanded here, so the user-environment-generator sets the path.
