[Service]
# ual StartTransientUnit copies Lomiri's environment. Nested Lomiri is a
# client of USC (MIR_SOCKET=/run/mir_socket, HYBRIS_EGLPLATFORM=null).
# Apps must instead be clients of nested Lomiri, with vendor GLES.
UnsetEnvironment=HYBRIS_EGLPLATFORM EGL_PLATFORM MIR_SERVER_HOST_SOCKET MIR_SERVER_PLATFORM_PATH MIR_SERVER_PLATFORM_GRAPHICS_LIB MIR_SERVER_CONSOLE_PROVIDER MIR_SERVER_FILE
Environment=MIR_SOCKET=%t/mir_socket
Environment=QT_QPA_PLATFORM=ubuntumirclient
Environment=ANDROID_ROOT=/system
Environment=ANDROID_DATA=/data
Environment=HYBRIS_LD_LIBRARY_PATH=/vendor/lib64/egl:/vendor/lib64:/system/lib64
Environment=LD_PRELOAD=/usr/lib/aarch64-linux-gnu/libb2n-abort.so
